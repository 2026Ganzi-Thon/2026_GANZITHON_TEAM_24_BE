spring:
  application:
    name: toro
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  servlet:
    multipart:
      # 녹음 파일 크기 제한 (넘으면 STT_002)
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET}
  expiration: 7d

app:
  # 회원가입 때 저장하는 약관 버전. 약관 내용이 바뀌면 올린다
  terms-version: 2026-11-v1
