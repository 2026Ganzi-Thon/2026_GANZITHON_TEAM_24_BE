# 로컬 개발용: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: toro-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: toro
      MYSQL_USER: toro
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-toro-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

  # STT는 Spring 백엔드가 Groq API로 요청한다. 별도 Python/STT 컨테이너는 사용하지 않는다.

volumes:
  mysql-data:
