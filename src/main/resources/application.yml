spring:
  application:
    name: toro
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  servlet:
    multipart:
      # 녹음 파일 크기 제한 (넘으면 STT_002)
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET}
  expiration: 7d

app:
  # 회원가입 때 저장하는 약관 버전. 약관 내용이 바뀌면 올린다
  terms-version: 2026-11-v1

upstage:
  api-key: ${UPSTAGE_API_KEY:}
  base-url: ${UPSTAGE_BASE_URL:https://api.upstage.ai/v1}
  model: ${UPSTAGE_MODEL:solar-pro4}
  connect-timeout: 5s
  read-timeout: 30s
