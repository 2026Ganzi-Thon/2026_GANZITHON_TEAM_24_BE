# 로컬 개발용: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: motdahan-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: motdahan
      MYSQL_USER: motdahan
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-motdahan-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

  # STT 서버 (faster-whisper) 는 만들어지면 여기에 추가
  # stt:
  #   build: ./stt
  #   ports:
  #     - "8000:8000"

volumes:
  mysql-data:
